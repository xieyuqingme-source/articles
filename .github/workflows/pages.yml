name: Publish personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the renamed root repository
        run: |
          if [ "$GITHUB_REPOSITORY" != "xieyuqingme-source/xieyuqingme-source.github.io" ]; then
            echo "::error::Rename and update remotes before publishing this unified site."
            exit 1
          fi
      - name: Read repository
        uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Markdown parser
        run: python -m pip install -r blog/requirements.txt
      - name: Check Markdown compatibility
        run: python scripts/test_build_blog.py
      - name: Check responsive image generation
        run: python scripts/test_image_assets.py
      - name: Check photography export and public pages
        run: python -m unittest discover -s scripts -p "test*photos*.py"
      - name: Check photography lightbox interactions
        run: node scripts/test_photos_logic.cjs
      - name: Check footprints data, map, journey and local exports
        run: |
          python scripts/test_map_pages.py
          node scripts/test_map_logic.cjs
          node scripts/test_map_journey.cjs
          node scripts/test_map_view.cjs
          node scripts/test_map_labels.cjs
          node scripts/test_map_avatar.cjs
          node scripts/test_map_playback.cjs
          node scripts/test_map_video.cjs
      - name: Check unified site rules
        run: python scripts/test_build_site.py
      - name: Check local about routes
        run: python scripts/test_about_routes.py
      - name: Check local game routes and navigation
        run: python scripts/test_game_routes.py
      - name: Check ranking model, persistence and export layout
        run: node --test scripts/test_ranking_logic.cjs
      - name: Check local image normalization and crop geometry
        run: node --test scripts/test_ranking_images.cjs
      - name: Check theme preference and system fallback
        run: node scripts/test_theme_defaults.cjs
      - name: Check disabled Waline integration
        run: node scripts/test_waline_logic.mjs
      - name: Check reading table of contents
        run: node scripts/test_toc_logic.cjs
      - name: Build and check personal site
        env:
          BLOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --site-url "$BLOG_SITE_URL"
      - name: Check archive interactions
        run: python scripts/test_archive_pages.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site_unified

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
