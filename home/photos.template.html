<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{photo_title}} · 谢雨卿</title>
  <meta name="description" content="{{photo_description}}">
  <meta name="author" content="Xie Yuqing (Carl)">
  <link rel="canonical" href="{{site_url}}/{{photo_path}}/">

  <meta property="og:description" content="{{photo_description}}">
  <meta property="og:url" content="{{site_url}}/{{photo_path}}/">
  <script>(() => { let theme = "light", saved; try { saved = localStorage.getItem("xieyuqing-blog-theme"); } catch (_) {} if (saved === "light" || saved === "dark") theme = saved; else try { if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"; } catch (_) {} document.documentElement.dataset.theme = theme; })();</script>
  <link rel="stylesheet" href="/assets/portal.css">
  <link rel="stylesheet" href="/assets/photos.css">
  <script src="/assets/portal.js" defer></script>
  <script src="/assets/photos.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header container">
    <a class="brand" href="/" aria-label="谢雨卿个人主页"><span class="brand-mark" aria-hidden="true">谢</span><span>谢雨卿 <small>XIE YUQING · CARL</small></span></a>
    <nav class="site-nav" aria-label="主导航"><a href="/">个人主页</a><a href="/articles/">文章 <span lang="en">Articles</span></a><a href="/projects/">作品 <span lang="en">Projects</span></a><a href="/photos/" aria-current="page">摄影 <span lang="en">Photos</span></a><a href="/map/">足迹 <span lang="en">Map</span></a><a href="/game/">小游戏 <span lang="en">Games</span></a><a href="/about/">关于我 <span lang="en">About</span></a></nav>

  </header>
